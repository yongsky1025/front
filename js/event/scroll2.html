<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        height: 4000px;
      }
      span {
        cursor: pointer;
      }
      .navbar {
        position: fixed;
        width: 100%;
      }
      .navbar-brand {
        font-size: 45px;
        transition: all 0.3s;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-light bg-light">
      <div class="container-fluid">
        <span class="navbar-brand">JSShop</span>
        <span class="badge bg-dark">Dark 🔄️</span>
      </div>
    </nav>
    <script>
      const nav = document.querySelector(".navbar");
      const element = document.querySelector(".navbar-brand");

      nav.addEventListener("click", (e) => {
        const span = e.target;

        // 어느 span 에서 이벤트가 발생했는가?
        if (span.classList.contains("badge")) {
          if (span.textContent.includes("Dark")) {
            //   Dark 🔄️ 클릭 시
            //   nav> bg-light => bg-dark 변경
            e.currentTarget.classList.replace("bg-light", "bg-dark");

            //   span> bg-dark => bg-light 변경
            span.classList.replace("bg-dark", "bg-light");
            //   글자색 노란색
            // span.style.color = "yellow";
            // span.previousElementSibling.style.color = "yellow";

            // class 명 이용 시
            span.classList.add("text-warning");
            span.previousElementSibling.classList.add("text-warning");

            //   light 🔄️ 로 변경
            span.textContent = "Light 🔄️";
          } else {
            //   light 🔄️ 클릭 시
            //   nav> bg-dark => bg-light 변경
            //   span> bg-light => bg-dark 변경
            e.currentTarget.classList.replace("bg-dark", "bg-light");
            span.classList.replace("bg-light", "bg-dark");

            //   글자색 검정
            span.classList.remove("text-warning");
            span.previousElementSibling.classList.remove("text-warning");

            //   Dark 🔄️ 로 변경
            span.textContent = "Dark 🔄️";
          }
        }
      });

      window.addEventListener("scroll", () => {
        // 마우스가 위로 올라올 때 글자 크기를 45px 변경
        // 현재 창에서 스크롤이 1/2 지점까지 움직일 때 글자 크기를 20px 변경
        // console.log("window.outerHeight", window.outerHeight);
        // console.log("window.innerHeight", window.innerHeight);

        if (window.scrollY > window.innerHeight / 2) {
          element.style.fontSize = "20px";
        } else {
          element.style.fontSize = "45px";
        }
      });
    </script>
  </body>
</html>
